name: Transfert archives en fragments
on:
  push:
    branches: [main]
    paths: ['.github/workflows/transfert-parts.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: geneve-transfert-parts
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
      - name: Split, verify and push original archives
        shell: python
        run: |
          import pathlib, json, hashlib, urllib.request, subprocess, os
          base = "https://github.com/jashari86besnik-design/geneve-virtuelle-transfert/releases/download/transfert-20261025/"
          def git(*args): subprocess.run(["git", *args], check=True)
          def sha(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1024*1024), b""): h.update(b)
              return h.hexdigest()
          index=pathlib.Path("c0f50ce9-2140-4418-ada9-5da73928ef75.json")
          urllib.request.urlretrieve(base+"GENEVE_TRANSFERT_CLAUDE.json",index)
          assert sha(index)=="6e26c77215a645293ab302836cd3fce52ea70bf7255ec1d62507ec37e71c08c8"
          data=json.loads(index.read_text())
          assert len(data["files"])==18
          manifest={"fragment_limit_bytes":90*1024*1024,"archives":[]}
          git("config","user.name","github-actions[bot]")
          git("config","user.email","41898282+github-actions[bot]@users.noreply.github.com")
          for a in data["files"]:
              name=a["filename"]
              assert pathlib.Path(name).name==name and name.endswith(".zip")
              src=pathlib.Path(os.environ["RUNNER_TEMP"])/name
              urllib.request.urlretrieve(base+name,src)
              assert src.stat().st_size==a["size_bytes"] and sha(src)==a["sha256"]
              d=pathlib.Path("parts")/name
              d.mkdir(parents=True,exist_ok=True)
              subprocess.run(["split","-b","90M","-d","-a","3","--numeric-suffixes=1",str(src),str(d/(name+".part"))],check=True)
              parts=[{"path":p.as_posix(),"size_bytes":p.stat().st_size,"sha256":sha(p)} for p in sorted(d.glob(name+".part[0-9][0-9][0-9]"))]
              h=hashlib.sha256()
              for part in parts:
                  assert part["size_bytes"]<=90*1024*1024
                  with pathlib.Path(part["path"]).open("rb") as f:
                      for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
              assert h.hexdigest()==a["sha256"]
              manifest["archives"].append({"name":name,"size_bytes":a["size_bytes"],"sha256":a["sha256"],"parts":parts})
              git("add","--",str(d))
              if subprocess.run(["git","diff","--cached","--quiet"]).returncode:
                  git("commit","-m","Add binary parts for "+name)
                  git("push","origin","HEAD:main")
              src.unlink()
          manifest["total_archives"]=len(manifest["archives"])
          manifest["total_fragments"]=sum(len(a["parts"]) for a in manifest["archives"])
          manifest["total_fragment_bytes"]=sum(a["size_bytes"] for a in manifest["archives"])
          pathlib.Path("MANIFEST.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n")
          git("add","MANIFEST.json",str(index))
          git("rm",".github/workflows/transfert-parts.yml")
          git("commit","-m","Add verified manifest and original index; remove transfer workflow")
          git("push","origin","HEAD:main")
          print(json.dumps({k:v for k,v in manifest.items() if k!="archives"}))
          
